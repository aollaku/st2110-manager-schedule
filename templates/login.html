<!DOCTYPE html>
<html>
<head>
    <title>ST-2110 Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            background: #090d12;
            color: #eaf2fb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
        }
        .login-box {
            width: min(420px, calc(100vw - 32px));
            background: #111a24;
            border: 1px solid #2b3a4d;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 18px 48px rgba(0,0,0,.35);
        }
        h1 { margin: 0 0 8px; }
        p { color: #93a8bd; }
        input, button {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #2b3a4d;
            background: #172333;
            color: #eaf2fb;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            font-size: 15px;
        }
        button {
            background: #12314a;
            border-color: #286692;
            cursor: pointer;
            font-weight: 700;
        }
        .error {
            background: #3b1518;
            border: 1px solid #9b2d35;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .default {
            background: #3b2b12;
            border: 1px solid #806224;
            color: #ffdf9a;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <form class="login-box" method="post">
        <h1>ST-2110 Manager</h1>
        <p>Sign in to access the portal.</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <input name="username" placeholder="Username" autofocus>
        <input name="password" placeholder="Password" type="password">
        <button type="submit">Login</button>
        <div class="default">
            First login: <b>admin</b> / <b>admin123</b><br>
            Change this password after login.
        </div>
    </form>
</body>
</html>
